<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 224 80" role="img" aria-label="SDBR">
  <title>SDBR</title>
  <!-- Logotipo genérico de SDBR Web: el buffer con sus tres zonas de color (verde, amarillo y
       rojo, los de componentes/zonas.py) y el nombre. La marca de cada empresa va en SDBR_LOGO. -->
  <rect x="4" y="14" width="16" height="52" rx="3" fill="#43a047"/>
  <rect x="24" y="14" width="16" height="52" rx="3" fill="#fdd835"/>
  <rect x="44" y="14" width="16" height="52" rx="3" fill="#e53935"/>
  <text x="72" y="58" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="44"
        font-weight="700" letter-spacing="1" fill="#2f4f7a">SDBR</text>
</svg>
